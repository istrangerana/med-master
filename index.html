<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MedMaster - Clinical & High-Yield Prep</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0369a1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-512.PNG">

  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-hover: rgba(30, 41, 59, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(56, 189, 248, 0.4);
      --primary: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.35);
      --primary-light: #38bdf8;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 15% 15%, #0f172a 0%, var(--bg) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 95px;
    }

    /* Ambient Glow Backgrounds */
    .glow-blob {
      position: fixed; width: 280px; height: 280px;
      border-radius: 50%; filter: blur(90px);
      pointer-events: none; z-index: 0; opacity: 0.18;
    }
    .glow-top { top: -60px; right: -60px; background: var(--primary); }
    .glow-mid { top: 45%; left: -80px; background: #6366f1; }

    /* Sticky Glass Header */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(7, 11, 20, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .brand-icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; }
    .brand-title { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.3px; color: #fff; }
    .brand-title span { color: var(--primary-light); }

    .user-pill {
      font-size: 0.78rem; font-weight: 600; padding: 7px 14px; border-radius: 30px;
      background: rgba(56, 189, 248, 0.08); border: 1px solid var(--border-focus);
      color: var(--primary-light); cursor: pointer; transition: all 0.2s;
    }
    .user-pill:active { transform: scale(0.96); background: rgba(56, 189, 248, 0.18); }

    /* Main Container */
    .view-content { display: none; padding: 18px; max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }
    .view-content.active { display: block; animation: viewFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes viewFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Summary Bar */
    .overall-stats-card {
      background: linear-gradient(135deg, rgba(2,132,199,0.15) 0%, rgba(15,23,42,0.6) 100%);
      border: 1px solid var(--border-focus);
      border-radius: 20px; padding: 18px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .stat-text h3 { font-size: 1.35rem; font-weight: 800; color: #fff; }
    .stat-text p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .circle-stat {
      width: 58px; height: 58px; border-radius: 50%;
      background: conic-gradient(var(--accent-cyan) 0deg, rgba(255,255,255,0.06) 0deg);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 800; color: #fff; position: relative;
    }
    .circle-stat::before {
      content: ""; position: absolute; inset: 5px; background: #0b1120; border-radius: 50%; z-index: 1;
    }
    .circle-stat span { position: relative; z-index: 2; }

    /* Accordion Subject Cards */
    .subject-accordion {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px; margin-bottom: 14px; overflow: hidden;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
    }
    .subject-accordion:hover { border-color: rgba(255,255,255,0.18); }
    .subject-header-btn {
      width: 100%; padding: 16px 18px; background: none; border: none;
      display: flex; align-items: center; justify-content: space-between;
      color: var(--text-main); cursor: pointer; text-align: left;
    }
    .sub-title-wrap { display: flex; align-items: center; gap: 14px; }
    .sub-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
    }
    .sub-text-title { font-size: 1rem; font-weight: 700; color: #fff; }
    .sub-text-count { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }
    .accordion-arrow {
      width: 18px; height: 18px; stroke: var(--text-muted); transition: transform 0.25s ease;
    }
    .subject-accordion.open .accordion-arrow { transform: rotate(180deg); stroke: var(--primary-light); }

    .sub-progress-bar-wrap { height: 4px; background: rgba(255,255,255,0.06); width: 100%; }
    .sub-progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent-cyan)); transition: width 0.3s; }

    .topic-list-drawer { display: none; padding: 12px 18px 18px; border-top: 1px solid rgba(255,255,255,0.04); }
    .subject-accordion.open .topic-list-drawer { display: block; }

    .topic-item-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
    }
    .topic-checkbox {
      width: 20px; height: 20px; border-radius: 6px;
      border: 1.8px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .topic-checkbox.checked {
      background: var(--primary); border-color: var(--primary-light);
    }
    .topic-checkbox svg { display: none; width: 13px; height: 13px; stroke: #fff; stroke-width: 3; fill: none; }
    .topic-checkbox.checked svg { display: block; }
    .topic-name { font-size: 0.88rem; color: #e2e8f0; line-height: 1.4; }
    .topic-item-row.checked-row .topic-name { text-decoration: line-through; color: var(--text-muted); }

    /* Focus Study Timer Card */
    .timer-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 26px; padding: 28px 20px; text-align: center;
      backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .timer-badge-mode {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(2,132,199,0.12); border: 1px solid var(--border-focus);
      color: var(--primary-light); font-size: 0.78rem; font-weight: 700;
      padding: 6px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.8px;
    }
    .timer-circle-wrap { position: relative; width: 250px; height: 250px; margin: 24px auto; }
    .timer-circle-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .circle-base { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 9; }
    .circle-indicator {
      fill: none; stroke: url(#timerGrad); stroke-width: 9;
      stroke-linecap: round; stroke-dasharray: 691; stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.4s ease;
    }
    .time-digits-display {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 3.5rem; font-weight: 900; font-variant-numeric: tabular-nums;
      color: #fff; letter-spacing: -1.5px;
    }
    
    .timer-chips-grid { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .preset-pill {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); padding: 8px 14px; border-radius: 12px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .preset-pill.active { background: var(--primary); color: #fff; border-color: var(--primary-light); }
    
    .custom-set-bar { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 24px; }
    .custom-set-bar input {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 10px; color: #fff; padding: 8px; width: 75px; text-align: center;
      font-size: 0.95rem; font-weight: 700; outline: none;
    }
    .custom-set-bar input:focus { border-color: var(--primary-light); }

    .timer-btn-row { display: flex; gap: 12px; justify-content: center; max-width: 360px; margin: 0 auto; }
    .btn-main-action {
      flex: 2; padding: 15px; border-radius: 16px; border: none;
      background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff;
      font-weight: 700; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 18px var(--primary-glow);
    }
    .btn-sub-action {
      flex: 1; padding: 15px; border-radius: 16px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.05); color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }

    /* Flashcard UI */
    .flashcard-deck-wrap { perspective: 1200px; margin-bottom: 22px; cursor: pointer; }
    .flashcard-inner-box {
      min-height: 250px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 24px; padding: 28px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d; backdrop-filter: blur(14px);
    }
    .flashcard-deck-wrap.flipped .flashcard-inner-box { transform: rotateY(180deg); }
    .card-face { backface-visibility: hidden; width: 100%; }
    .card-face-back { position: absolute; transform: rotateY(180deg); color: var(--primary-light); }
    .card-subject-tag {
      position: absolute; top: 18px; left: 20px;
      font-size: 0.72rem; text-transform: uppercase; font-weight: 700;
      color: var(--accent-cyan); background: rgba(6,182,212,0.1);
      padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(6,182,212,0.25);
    }
    .card-content-text { font-size: 1.15rem; font-weight: 600; line-height: 1.55; margin-top: 15px; }

    /* Bottom Floating Navigation */
    .nav-bar-container {
      position: fixed; bottom: 0; left: 0; right: 0; height: 72px;
      background: rgba(7, 11, 20, 0.88);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 45;
    }
    .nav-tab-item {
      background: none; border: none; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      font-size: 0.72rem; font-weight: 600; cursor: pointer; flex: 1; transition: 0.2s;
    }
    .nav-tab-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-tab-item.active { color: var(--primary-light); }
  </style>
</head>
<body>

  <!-- Ambient Light Orbs -->
  <div class="glow-blob glow-top"></div>
  <div class="glow-blob glow-mid"></div>

  <!-- Header -->
  <header>
    <div class="brand-wrap">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="brand-title">Med<span>Master</span></div>
    </div>
    <div id="authBtn" class="user-pill" onclick="signInPrompt()">Doctor Login</div>
  </header>

  <!-- 1. CHECKLIST SCREEN (DEFAULT) -->
  <main id="view-checklist" class="view-content active">
    <div class="overall-stats-card">
      <div class="stat-text">
        <h3 id="overallPercentage">0% Prepared</h3>
        <p><span id="totalCheckedCount">0</span> of <span id="totalTopicCount">0</span> High-Yield Topics Done</p>
      </div>
      <div class="circle-stat" id="statRing">
        <span id="circleStatVal">0%</span>
      </div>
    </div>

    <!-- Subject Accordions Injected by JS -->
    <div id="subjectListContainer"></div>
  </main>

  <!-- 2. FOCUS TIMER SCREEN -->
  <section id="view-timer" class="view-content">
    <div class="timer-card">
      <div id="timerModeBadge" class="timer-badge-mode">
        <span>⚡</span> Deep Study Block
      </div>

      <!-- Presets -->
      <div class="timer-chips-grid" style="margin-top: 18px;">
        <button class="preset-pill active" onclick="setTimerDuration(25, this)">25m Focus</button>
        <button class="preset-pill" onclick="setTimerDuration(50, this)">50m High-Yield</button>
        <button class="preset-pill" onclick="setTimerDuration(90, this)">90m GT Block</button>
        <button class="preset-pill" onclick="setTimerDuration(5, this)">5m Rest</button>
      </div>

      <!-- Custom Input -->
      <div class="custom-set-bar">
        <span style="font-size: 0.82rem; color: var(--text-muted);">Custom:</span>
        <input type="number" id="customInputMins" placeholder="Mins" min="1" max="180">
        <button class="preset-pill" onclick="applyCustomMins()">Set</button>
      </div>

      <!-- Neon Ring -->
      <div class="timer-circle-wrap">
        <svg class="timer-circle-svg" viewBox="0 0 240 240">
          <defs>
            <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
          </defs>
          <circle class="circle-base" cx="120" cy="120" r="110"/>
          <circle id="timerProgressRing" class="circle-indicator" cx="120" cy="120" r="110"/>
        </svg>
        <div id="timerNumbers" class="time-digits-display">25:00</div>
      </div>

      <!-- Control Buttons -->
      <div class="timer-btn-row">
        <button id="togglePlayBtn" class="btn-main-action" onclick="toggleTimer()">Start Session</button>
        <button class="btn-sub-action" onclick="resetTimer()">Reset</button>
      </div>

      <!-- Daily Session Metrics -->
      <div style="display:flex; justify-content:space-around; margin-top: 26px; border-top:1px solid var(--border); padding-top:18px;">
        <div>
          <div style="font-size:1.3rem; font-weight:800; color:#fff;" id="metricSessions">0</div>
          <div style="font-size:0.7rem; text-transform:uppercase; color:var(--text-muted);">Completed</div>
        </div>
        <div>
          <div style="font-size:1.3rem; font-weight:800; color:#fff;" id="metricMinutes">0m</div>
          <div style="font-size:0.7rem; text-transform:uppercase; color:var(--text-muted);">Focus Time</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. FLASHCARDS SCREEN -->
  <section id="view-cards" class="view-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="font-size:1.15rem; font-weight:800;">High-Yield Spaced Cards</h2>
      <span style="font-size:0.8rem; color:var(--text-muted);" id="cardCounter">1 / 10</span>
    </div>

    <div class="flashcard-deck-wrap" id="cardHolder" onclick="this.classList.toggle('flipped')">
      <div class="flashcard-inner-box">
        <div class="card-face">
          <span class="card-subject-tag" id="cardSubjectBadge">Pharmacology</span>
          <div class="card-content-text" id="cardFront">Tap to flip</div>
        </div>
        <div class="card-face card-face-back">
          <span class="card-subject-tag" style="color:var(--accent-emerald); background:rgba(16,185,129,0.1); border-color:rgba(16,185,129,0.25);">High-Yield Answer</span>
          <div class="card-content-text" id="cardBack">Answer details</div>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:12px;">
      <button class="btn-sub-action" onclick="prevFlashcard()">← Previous</button>
      <button class="btn-main-action" onclick="nextFlashcard()">Next Card →</button>
    </div>
  </section>

  <!-- Navigation Bar -->
  <nav class="nav-bar-container">
    <button class="nav-tab-item active" onclick="navigate('view-checklist', this)">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      19 Subjects
    </button>
    <button class="nav-tab-item" onclick="navigate('view-timer', this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Focus Timer
    </button>
    <button class="nav-tab-item" onclick="navigate('view-cards', this)">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      Flashcards
    </button>
  </nav>

  <script>

      { s: "Pharmacology", f: "What is the specific drug of choice for Paracetamol poisoning within 8 hours of ingestion?", b: "N-acetylcysteine (NAC) - replenishes hepatocellular glutathione stores to neutralize toxic NAPQI." },

    // --- ACCORDION CHECKLIST ENGINE ---
    let totalTopics = 0;
    let checkedTopics = 0;

    function initChecklist() {
      const container = document.getElementById('subjectListContainer');
      container.innerHTML = '';
      totalTopics = 0;
      checkedTopics = 0;

      SUBJECT_DATA.forEach((subject, sIdx) => {
        totalTopics += subject.topics.length;
        
        let subChecked = 0;
        subject.topics.forEach((_, tIdx) => {
          if (localStorage.getItem(`med_v2_t_${sIdx}_${tIdx}`) === '1') subChecked++;
        });
        checkedTopics += subChecked;

        const subPercent = Math.round((subChecked / subject.topics.length) * 100);

        const card = document.createElement('div');
        card.className = 'subject-accordion';
        card.id = `subCard_${sIdx}`;
        card.innerHTML = `
          <button class="subject-header-btn" onclick="toggleAccordion(${sIdx})">
            <div class="sub-title-wrap">
              <div class="sub-icon">${subject.icon}</div>
              <div>
                <div class="sub-text-title">${subject.name}</div>
                <div class="sub-text-count" id="subCountText_${sIdx}">${subChecked} / ${subject.topics.length} Done (${subPercent}%)</div>
              </div>
            </div>
            <svg class="accordion-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sub-progress-bar-wrap">
            <div class="sub-progress-bar-fill" id="subBar_${sIdx}" style="width: ${subPercent}%"></div>
          </div>
          <div class="topic-list-drawer">
            ${subject.topics.map((top, tIdx) => {
              const isChecked = localStorage.getItem(`med_v2_t_${sIdx}_${tIdx}`) === '1';
              return `
                <div class="topic-item-row ${isChecked ? 'checked-row' : ''}" id="row_${sIdx}_${tIdx}" onclick="toggleTopic(${sIdx}, ${tIdx})">
                  <div class="topic-checkbox ${isChecked ? 'checked' : ''}" id="check_${sIdx}_${tIdx}">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                  <span class="topic-name">${top}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
        container.appendChild(card);
      });

      refreshTopMetrics();
    }

    function toggleAccordion(sIdx) {
      document.getElementById(`subCard_${sIdx}`).classList.toggle('open');
    }

    function toggleTopic(sIdx, tIdx) {
      const key = `med_v2_t_${sIdx}_${tIdx}`;
      const currentState = localStorage.getItem(key) === '1';
      const newState = !currentState;

      localStorage.setItem(key, newState ? '1' : '0');

      const checkEl = document.getElementById(`check_${sIdx}_${tIdx}`);
      const rowEl = document.getElementById(`row_${sIdx}_${tIdx}`);
      if (newState) {
        checkEl.classList.add('checked');
        rowEl.classList.add('checked-row');
        checkedTopics++;
      } else {
        checkEl.classList.remove('checked');
        rowEl.classList.remove('checked-row');
        checkedTopics--;
      }

      // Update subject bar
      let subDone = 0;
      SUBJECT_DATA[sIdx].topics.forEach((_, i) => {
        if (localStorage.getItem(`med_v2_t_${sIdx}_${i}`) === '1') subDone++;
      });
      const pct = Math.round((subDone / SUBJECT_DATA[sIdx].topics.length) * 100);
      document.getElementById(`subBar_${sIdx}`).style.width = `${pct}%`;
      document.getElementById(`subCountText_${sIdx}`).textContent = `${subDone} / ${SUBJECT_DATA[sIdx].topics.length} Done (${pct}%)`;

      refreshTopMetrics();
    }

    function refreshTopMetrics() {
      document.getElementById('totalCheckedCount').textContent = checkedTopics;
      document.getElementById('totalTopicCount').textContent = totalTopics;
      const overall = totalTopics > 0 ? Math.round((checkedTopics / totalTopics) * 100) : 0;
      document.getElementById('overallPercentage').textContent = `${overall}% Completed`;
      document.getElementById('circleStatVal').textContent = `${overall}%`;
      document.getElementById('statRing').style.background = `conic-gradient(var(--accent-cyan) ${overall * 3.6}deg, rgba(255,255,255,0.06) 0deg)`;
    }

    // --- FOCUS TIMER ENGINE ---
    let timerDuration = 25 * 60;
    let timerLeft = 25 * 60;
    let timerId = null;
    let isTimerActive = false;
    let completedSessions = 0;
    let totalStudiedSecs = 0;
    const ringCircumference = 2 * Math.PI * 110;

    function renderTimerUI() {
      const m = Math.floor(timerLeft / 60);
      const s = timerLeft % 60;
      document.getElementById('timerNumbers').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      const offset = ringCircumference - (timerLeft / timerDuration) * ringCircumference;
      document.getElementById('timerProgressRing').style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      const playBtn = document.getElementById('togglePlayBtn');
      if (isTimerActive) {
        clearInterval(timerId);
        isTimerActive = false;
        playBtn.textContent = 'Resume Session';
        playBtn.style.background = 'linear-gradient(135deg, #0284c7, #0369a1)';
      } else {
        isTimerActive = true;
        playBtn.textContent = 'Pause Focus';
        playBtn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        timerId = setInterval(() => {
          if (timerLeft > 0) {
            timerLeft--;
            totalStudiedSecs++;
            renderTimerUI();
            updateTimerStats();
          } else {
            clearInterval(timerId);
            isTimerActive = false;
            completedSessions++;
            ringBell();
            alert('Study block finished! Great focus doctor.');
            resetTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerId);
      isTimerActive = false;
      timerLeft = timerDuration;
      const playBtn = document.getElementById('togglePlayBtn');
      playBtn.textContent = 'Start Session';
      playBtn.style.background = 'linear-gradient(135deg, #0284c7, #0369a1)';
      renderTimerUI();
    }

    function setTimerDuration(mins, btn) {
      document.querySelectorAll('.preset-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      timerDuration = mins * 60;
      timerLeft = timerDuration;
      document.getElementById('timerModeBadge').innerHTML = mins <= 10 ? '<span>☕</span> Rest & Reset' : '<span>⚡</span> Deep Study Block';
      resetTimer();
    }

    function applyCustomMins() {
      const input = document.getElementById('customInputMins');
      const val = parseInt(input.value, 10);
      if (val && val > 0 && val <= 180) {
        setTimerDuration(val, null);
      }
    }

    function updateTimerStats() {
      document.getElementById('metricSessions').textContent = completedSessions;
      const m = Math.floor(totalStudiedSecs / 60);
      document.getElementById('metricMinutes').textContent = `${m}m`;
    }

    function ringBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    // --- FLASHCARD ENGINE ---
    let curCard = 0;
    function renderFlashcard() {
      document.getElementById('cardHolder').classList.remove('flipped');
      document.getElementById('cardSubjectBadge').textContent = CARDS[curCard].s;
      document.getElementById('cardFront').textContent = CARDS[curCard].f;
      document.getElementById('cardBack').textContent = CARDS[curCard].b;
      document.getElementById('cardCounter').textContent = `${curCard + 1} / ${CARDS.length}`;
    }

    function nextFlashcard() {
      curCard = (curCard + 1) % CARDS.length;
      renderFlashcard();
    }

    function prevFlashcard() {
      curCard = (curCard - 1 + CARDS.length) % CARDS.length;
      renderFlashcard();
    }

    // --- NAVIGATION ---
    function navigate(viewId, btn) {
      document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-tab-item').forEach(b => b.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function signInPrompt() {
      const email = prompt("Enter your personal email to register or log into MedMaster:");
      if (email && email.includes('@')) {
        document.getElementById('authBtn').textContent = "Dr. " + email.split('@')[0];
        alert("Logged in as " + email + ". Your subject checkpoints and focus hours are saved to your profile.");
      }
    }

    // --- INIT ---
    window.addEventListener('DOMContentLoaded', () => {
      initChecklist();
      renderTimerUI();
      renderFlashcard();
    });
  </script>
