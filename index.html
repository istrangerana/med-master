<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MedMaster - NEET PG & FMGE Prep</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-512.PNG">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --primary-light: #38bdf8;
      --accent: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 85px; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; color: #fff; }
    .brand span { color: var(--primary-light); }
    .user-pill {
      font-size: 0.8rem; padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--primary-light); cursor: pointer;
    }

    .tab-content { display: none; padding: 20px; max-width: 650px; margin: 0 auto; }
    .tab-content.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 40;
    }
    .nav-btn {
      background: none; border: none; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 0.72rem; cursor: pointer; flex: 1;
    }
    .nav-btn.active { color: var(--primary-light); font-weight: 600; }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* Timer Styles */
    .timer-container {
      display: flex; flex-direction: column; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 24px; padding: 30px 20px; margin-top: 10px;
      text-align: center;
    }
    .timer-circle-wrap { position: relative; width: 240px; height: 240px; margin: 20px 0; }
    .timer-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .timer-circle-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; }
    .timer-circle-progress {
      fill: none; stroke: var(--primary-light); stroke-width: 8;
      stroke-linecap: round; stroke-dasharray: 691; stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s ease;
    }
    .timer-time-display {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 3.2rem; font-weight: 800; font-variant-numeric: tabular-nums;
      color: #fff; letter-spacing: -1px;
    }
    .timer-status-badge {
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--primary-light); margin-bottom: 5px;
    }
    
    .preset-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
    .preset-chip {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text-muted); padding: 8px 14px; border-radius: 12px;
      font-size: 0.8rem; cursor: pointer; font-weight: 600;
    }
    .preset-chip.active { background: var(--primary); color: #fff; border-color: var(--primary-light); }

    .custom-input-wrap {
      display: flex; gap: 8px; align-items: center; margin-bottom: 20px;
    }
    .custom-input-wrap input {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 10px; color: #fff; width: 70px; padding: 8px; text-align: center;
      font-size: 0.9rem; font-weight: 600;
    }

    .timer-controls { display: flex; gap: 12px; width: 100%; max-width: 320px; }
    .btn-timer-primary {
      flex: 2; padding: 14px; border-radius: 14px; border: none;
      background: var(--primary); color: white; font-weight: 700;
      font-size: 1rem; cursor: pointer;
    }
    .btn-timer-secondary {
      flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.06); color: var(--text); font-weight: 600;
      font-size: 0.95rem; cursor: pointer;
    }

    .timer-metrics {
      display: flex; justify-content: space-around; width: 100%; max-width: 380px;
      margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border);
    }
    .metric-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .metric-value { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .metric-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; }

    /* Flashcards & Checklist Styles */
    .card-box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px; margin-bottom: 12px;
    }
    .subject-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
    .topic-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.88rem; }
    .topic-item input { accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer; }

    /* Flashcard Flip */
    .flashcard {
      min-height: 220px; perspective: 1000px; cursor: pointer; margin-bottom: 20px;
    }
    .flashcard-inner {
      position: relative; width: 100%; min-height: 220px; text-align: center;
      transition: transform 0.5s; transform-style: preserve-3d;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
      display: flex; align-items: center; justify-content: center; padding: 25px;
    }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute; backface-visibility: hidden; font-size: 1.05rem; line-height: 1.5;
    }
    .flashcard-back { transform: rotateY(180deg); color: var(--primary-light); }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Med<span>Master</span>
    </div>
    <div id="authPill" class="user-pill" onclick="handleAuthAction()">Doctor Sign In</div>
  </header>

  <!-- 1. Focus Timer Screen -->
  <div id="tab-timer" class="tab-content active">
    <div class="timer-container">
      <div id="timerModeBadge" class="timer-status-badge">Focus Study Block</div>

      <!-- Presets -->
      <div class="preset-chips">
        <button class="preset-chip active" onclick="setTimerPreset(25, this)">25m Focus</button>
        <button class="preset-chip" onclick="setTimerPreset(50, this)">50m Deep Block</button>
        <button class="preset-chip" onclick="setTimerPreset(90, this)">90m GT Mock</button>
        <button class="preset-chip" onclick="setTimerPreset(5, this)">5m Break</button>
      </div>

      <!-- Custom duration -->
      <div class="custom-input-wrap">
        <span style="font-size: 0.8rem; color: var(--text-muted);">Custom:</span>
        <input type="number" id="customMinutes" placeholder="Mins" min="1" max="180">
        <button class="preset-chip" onclick="applyCustomTime()">Set</button>
      </div>

      <!-- Circular SVG Progress -->
      <div class="timer-circle-wrap">
        <svg class="timer-svg" viewBox="0 0 240 240">
          <circle class="timer-circle-bg" cx="120" cy="120" r="110"/>
          <circle id="timerProgress" class="timer-circle-progress" cx="120" cy="120" r="110"/>
        </svg>
        <div id="timerDisplay" class="timer-time-display">25:00</div>
      </div>

      <!-- Play / Reset Controls -->
      <div class="timer-controls">
        <button id="startPauseBtn" class="btn-timer-primary" onclick="toggleTimer()">Start Focus</button>
        <button class="btn-timer-secondary" onclick="resetTimer()">Reset</button>
      </div>

      <!-- Metrics -->
      <div class="timer-metrics">
        <div class="metric-item">
          <div id="sessionsCount" class="metric-value">0</div>
          <div class="metric-label">Sessions Done</div>
        </div>
        <div class="metric-item">
          <div id="totalStudyMinutes" class="metric-value">0h 0m</div>
          <div class="metric-label">Total Time</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. Checklist Screen -->
  <div id="tab-checklist" class="tab-content">
    <h2 style="font-size: 1.2rem; margin-bottom: 12px; font-weight: 700;">19 High-Yield Subjects</h2>
    <div id="subjectListContainer"></div>
  </div>

  <!-- 3. Spaced Flashcards Screen -->
  <div id="tab-flashcards" class="tab-content">
    <h2 style="font-size: 1.2rem; margin-bottom: 12px; font-weight: 700;">High-Yield NEET Cards</h2>
    <div class="flashcard" id="cardElement" onclick="this.classList.toggle('flipped')">
      <div class="flashcard-inner">
        <div class="flashcard-front" id="cardFrontText">Loading...</div>
        <div class="flashcard-back" id="cardBackText">Loading...</div>
      </div>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn-timer-secondary" style="flex: 1;" onclick="prevCard()">Previous</button>
      <button class="btn-timer-primary" style="flex: 1;" onclick="nextCard()">Next Card</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tab-timer', this)">
      <svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm0 2C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm1-11h4a1 1 0 1 1 0 2h-5a1 1 0 0 1-1-1V7a1 1 0 1 1 2 0v4z"/></svg>
      Timer
    </button>
    <button class="nav-btn" onclick="switchTab('tab-checklist', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      Tracker
    </button>
    <button class="nav-btn" onclick="switchTab('tab-flashcards', this)">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      Cards
    </button>
  </nav>

  <script>
    // --- 1. Custom Focus Timer Engine ---
    let timerDuration = 25 * 60; // 25 mins default
    let timeRemaining = 25 * 60;
    let timerInterval = null;
    let isRunning = false;
    let completedSessions = 0;
    let totalSecondsLearned = 0;

    const circumference = 2 * Math.PI * 110; // SVG circle radius 110 (~691px)
    const timerProgress = document.getElementById('timerProgress');
    const timerDisplay = document.getElementById('timerDisplay');
    const startPauseBtn = document.getElementById('startPauseBtn');

    function updateTimerUI() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const offset = circumference - (timeRemaining / timerDuration) * circumference;
      timerProgress.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startPauseBtn.textContent = 'Resume Focus';
        startPauseBtn.style.background = 'var(--primary)';
      } else {
        isRunning = true;
        startPauseBtn.textContent = 'Pause';
        startPauseBtn.style.background = 'var(--warning)';
        
        timerInterval = setInterval(() => {
          if (timeRemaining > 0) {
            timeRemaining--;
            totalSecondsLearned++;
            updateTimerUI();
            updateMetrics();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            completedSessions++;
            playChime();
            alert('🎉 Session complete! Time for a brief break or flashcard review.');
            resetTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeRemaining = timerDuration;
      startPauseBtn.textContent = 'Start Focus';
      startPauseBtn.style.background = 'var(--primary)';
      updateTimerUI();
    }

    function setTimerPreset(mins, element) {
      document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
      if(element) element.classList.add('active');
      timerDuration = mins * 60;
      timeRemaining = timerDuration;
      document.getElementById('timerModeBadge').textContent = mins <= 10 ? 'Rest & Refresh' : 'Deep Study Session';
      resetTimer();
    }

    function applyCustomTime() {
      const val = parseInt(document.getElementById('customMinutes').value, 10);
      if (val && val > 0 && val <= 180) {
        setTimerPreset(val, null);
      }
    }

    function updateMetrics() {
      document.getElementById('sessionsCount').textContent = completedSessions;
      const h = Math.floor(totalSecondsLearned / 3600);
      const m = Math.floor((totalSecondsLearned % 3600) / 60);
      document.getElementById('totalStudyMinutes').textContent = `${h}h ${m}m`;
    }

    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch(e){}
    }

    // --- 2. Subjects Data & Tracker ---
    const SUBJECT_DATA = [
      { name: "Anatomy", topics: ["Upper & Lower Limb Spaces", "Brachial Plexus Injuries", "Cranial Nerves & Foramina", "Embryology & Pharyngeal Arches"] },
      { name: "Physiology", topics: ["Action Potential & Nerve Fibers", "Cardiac Cycle & Hemodynamics", "Respiratory Compliance & V/Q", "Renal Clearance & Countercurrent"] },
      { name: "Pharmacology", topics: ["General Pharm & Bioavailability", "Autonomic Nervous System", "Antimicrobials (Cell Wall & Protein Synth)", "Chemotherapy & Monoclonals"] },
      { name: "Pathology", topics: ["Cellular Adaptations & Apoptosis", "Neoplasia & Tumor Markers", "Vasculitis Classifications", "Leukemias & Lymphomas Translocations"] },
      { name: "Microbiology", topics: ["Gram Positive & Negative Cocci", "Mycobacteria & Leprosy Diagnosis", "Virology (Hepatitis & HIV)", "Mycology & Parasitology Eggs/Cysts"] },
      { name: "Forensic Medicine", topics: ["Postmortem Changes & Rigor", "Mechanical Injuries & Firearms", "Toxicology (Organophosphates, Snakebite)", "Medical Jurisprudence & POCSO"] },
      { name: "PSM / Community Medicine", topics: ["Biostatistics & Study Designs", "Epidemiology Measures (RR, OR)", "National Health Programs", "Immunization Schedule & Vaccines"] },
      { name: "Ophthalmology", topics: ["Cataract Types & Surgeries", "Glaucoma Classifications & Drugs", "Retinopathy (Diabetic & Hypertensive)", "Corneal Ulcers & Refraction"] },
      { name: "ENT", topics: ["CSOM & Cholesteatoma", "Audiometry & Tuning Fork Tests", "Malignancies (Nasopharyngeal, Laryngeal)", "Epistaxis Management"] },
      { name: "Medicine", topics: ["Cardiology (ECG Interpretation, MI, HF)", "Neurology (Stroke & Localization)", "Endocrinology (Thyroid, Diabetes, Adrenal)", "Nephrology (Glomerulonephritis, AKI)"] },
      { name: "Surgery", topics: ["Trauma Protocols & ATLS", "Thyroid & Breast Carcinoma", "Acute Abdomen & Appendicitis", "Hernias & Arterial Occlusive Disease"] },
      { name: "Obstetrics & Gynaecology", topics: ["Antenatal Care & USG Markers", "Hypertensive Disorders in Pregnancy", "Abnormal Uterine Bleeding (PALM-COEIN)", "Cervical & Endometrial Malignancies"] },
      { name: "Pediatrics", topics: ["Milestones & Growth Charts", "Congenital Heart Diseases", "Neonatal Resuscitation & Jaundice", "Genetic Syndromes (Trisomies)"] },
      { name: "Orthopedics", topics: ["Pediatric Fractures (Salter-Harris)", "Bone Tumors & Radiology", "Nerve Injuries associated with Fractures", "Spine Deformities & Tuberculosis"] },
      { name: "Dermatology", topics: ["Vesiculobullous Disorders", "Papulosquamous Lesions (Psoriasis)", "Sexually Transmitted Infections", "Leprosy Reactions"] },
      { name: "Psychiatry", topics: ["Schizophrenia & Antipsychotics", "Mood Disorders (Depression & Bipolar)", "Anxiety & OCD Protocols", "Substance Abuse & Withdrawal"] },
      { name: "Radiology", topics: ["Chest X-Ray Classic Signs", "Emergency Head CT findings", "Radiation Safety & Contrast Media", "USG Doppler Applications"] },
      { name: "Anesthesia", topics: ["General Anesthesia Agents & Halothane", "Airway Assessment & Intubation", "Local Anesthetic Toxicity", "Spinal vs Epidural Blocks"] },
      { name: "Emergency Medicine", topics: ["BLS & ACLS Guidelines", "Shock Classification & Resuscitation", "Fluid Protocols in Burns", "Acid-Base Blood Gas Analysis"] }
    ];

    function renderChecklist() {
      const container = document.getElementById('subjectListContainer');
      container.innerHTML = '';
      SUBJECT_DATA.forEach((s, sIdx) => {
        const box = document.createElement('div');
        box.className = 'card-box';
        box.innerHTML = `
          <div class="subject-header">
            <span>${s.name}</span>
            <span style="font-size:0.75rem; color:var(--primary-light);">${s.topics.length} Key Topics</span>
          </div>
          ${s.topics.map((t, tIdx) => `
            <label class="topic-item">
              <input type="checkbox" id="topic_${sIdx}_${tIdx}" onchange="saveTopicState(${sIdx}, ${tIdx}, this.checked)">
              <span>${t}</span>
            </label>
          `).join('')}
        `;
        container.appendChild(box);
      });
    }

    function saveTopicState(sIdx, tIdx, val) {
      localStorage.setItem(`medmaster_topic_${sIdx}_${tIdx}`, val);
    }

    function loadTopicState() {
      SUBJECT_DATA.forEach((s, sIdx) => {
        s.topics.forEach((_, tIdx) => {
          const el = document.getElementById(`topic_${sIdx}_${tIdx}`);
          if (el && localStorage.getItem(`medmaster_topic_${sIdx}_${tIdx}`) === 'true') {
            el.checked = true;
          }
        });
      });
    }

    // --- 3. Flashcards Engine ---
    const CARDS = [
      { f: "Drug of choice for Paracetamol Poisoning?", b: "N-acetylcysteine (NAC) - replenishes hepatocellular glutathione." },
      { f: "Starry sky appearance on lymph node biopsy?", b: "Burkitt Lymphoma (t(8;14) translocation; c-myc overexpression)." },
      { f: "Most common site of hypertensive intracranial bleed?", b: "Putamen / Basal Ganglia (Charcot-Bouchard microaneurysms)." },
      { f: "Steeple sign on AP neck radiograph indicates?", b: "Croup (Laryngotracheobronchitis) caused by Parainfluenza." },
      { f: "Signet ring sign on HRCT chest indicates?", b: "Bronchiectasis (internal broncho-arterial ratio > 1)." },
      { f: "Onion skin periosteal reaction is classic for?", b: "Ewing Sarcoma (t(11;22) translocation)." }
    ];
    let cardIdx = 0;

    function renderCard() {
      document.getElementById('cardElement').classList.remove('flipped');
      document.getElementById('cardFrontText').textContent = CARDS[cardIdx].f;
      document.getElementById('cardBackText').textContent = CARDS[cardIdx].b;
    }
    function nextCard() { cardIdx = (cardIdx + 1) % CARDS.length; renderCard(); }
    function prevCard() { cardIdx = (cardIdx - 1 + CARDS.length) % CARDS.length; renderCard(); }

    // --- Navigation ---
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function handleAuthAction() {
      const email = prompt("Enter student email to sign in or register profile:");
      if (email) {
        document.getElementById('authPill').textContent = email.split('@')[0];
        alert("Signed in as " + email + ". Your focus metrics and subject checklist will sync automatically.");
      }
    }

    // --- Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      updateTimerUI();
      renderChecklist();
      loadTopicState();
      renderCard();
    });
  </script>
</body>
</html>
